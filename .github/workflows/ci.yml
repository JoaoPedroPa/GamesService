name: GamesService CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar solução
        run: dotnet build --configuration Release --no-restore

      - name: Executar testes com cobertura
        run: >
          dotnet test
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Instalar ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Gerar relatório visual
        run: >
          reportgenerator
          "-reports:TestResults/**/coverage.cobertura.xml"
          "-targetdir:CoverageReport"
          "-reporttypes:Html;MarkdownSummaryGithub"
          "-title:GamesService - Cobertura de testes"

      - name: Exibir cobertura no Summary
        run: cat CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Salvar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: games-service-test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Salvar relatório visual de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: games-service-coverage-report
          path: CoverageReport/
          if-no-files-found: warn